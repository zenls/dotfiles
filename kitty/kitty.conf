# Font
font_family Hack Nerd Font
font_size 12
disable_ligatures always
# Make dark text on bright backgrounds (such as the Git prompt) less thin.
text_composition_strategy 1.5 0

# Window
window_padding_width 0
# Put space left over from the cell grid at the bottom and right edges.
placement_strategy top-left
background_opacity 0.7
background_blur 1

# Cursor
cursor_shape underline
cursor_blink_interval 0
cursor #616161
cursor_text_color #122637
shell_integration no-cursor

# Scrollback and scrolling
scrollback_lines 50000
wheel_scroll_multiplier 3
touch_scroll_multiplier 3

# Clipboard and bell
copy_on_select clipboard
enable_audio_bell no

# Notify when commands finish in an unfocused window (minimum runtime: 5s).
notify_on_cmd_finish unfocused

# Colors from alacritty/alacritty.toml
# Keep ANSI black distinct from the transparent background so Agnoster's
# user@host segment stays opaque.
background #010101
foreground #D0D0D0

# ANSI 0-7: black, red, green, yellow, blue, magenta, cyan, white.
color0 #000000
color1 #ff0000
color2 #37dd21
color3 #fee409
color4 #1460d2
color5 #ff005d
color6 #00bbbb
color7 #bbbbbb

# ANSI 8-15: bright variants in the same order.
color8 #545454
color9 #f40d17
color10 #3bcf1d
color11 #ecc809
color12 #5555ff
color13 #ff55ff
color14 #6ae3f9
color15 #ffffff
