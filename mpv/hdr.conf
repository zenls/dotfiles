# Neutral HDR playback for the MO27Q28G's HDR Peak 1500 preset.
# Launch with: mpv --no-config --include="$HOME/.config/dotfiles/mpv/hdr.conf" FILE
# Use on HDMI-A-4 with HDR Peak 1500 selected in the monitor's menu.
# EDID reports ~1532 nits; use the nominal 1500-nit peak, not a measured value.
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
target-colorspace-hint=yes
screen-name=HDMI-A-4
fs-screen-name=HDMI-A-4

# Let mpv map the movie to the display's nominal peak before HDR output.
target-colorspace-hint-mode=target
target-trc=pq
target-prim=bt.2020
target-peak=1500
tone-mapping=bt.2390

# Reference white when playing SDR content through this HDR-only profile.
hdr-reference-white=180
saturation=0
hue=0
