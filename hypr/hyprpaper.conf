# Match physical displays so connector renumbering cannot swap wallpapers.
# Outputs without a match show Hyprland's built-in wallpaper.
# Left portrait Philips.
wallpaper {
    monitor = desc:Philips Consumer Electronics Company PHL27E1N5600H UK02346057703
    path = ~/.config/hypr/anime_girl.jpg
    fit_mode = cover
}

# Upper landscape Philips.
wallpaper {
    monitor = desc:Philips Consumer Electronics Company PHL24E1N5300 UK02214010768
    path = ~/.config/hypr/anime_rain.jpeg
    fit_mode = cover
}

splash = false
