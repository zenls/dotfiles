################
### MONITORS ###
################

# monitor = eDP-1, 2560x1440@59.95, 0x0, 1
# # monitor = DP-1, 1920x1080@60, 0x0, 1, mirror, eDP-1
# # monitor = HDMI-A-4, 1920x1080@60, 0x0, 1, mirror, eDP-1
# workspace = 1, monitor:eDP-1, default:true

# Main monitor: keep HDR output, with SDR black/white levels tuned for desktop use.
monitorv2 {
    output = HDMI-A-4
    mode = 2560x1440@59.95
    position = 0x0
    scale = 1
    bitdepth = 10
    cm = hdr

    # HDR Peak 1500 preset: EDID reports ~1532 nits peak, ~295 nits average.
    # Use the nominal 1500-nit peak; these are not measured calibration values.
    min_luminance = 0
    max_luminance = 1500
    max_avg_luminance = 295

    # SDR desktop white level in nits, independent of the HDR highlight peak.
    sdr_min_luminance = 0
    sdr_max_luminance = 140
    sdrbrightness = 1.0
    # Personal SDR color preference; keep brightness and the sRGB curve separate.
    sdrsaturation = 1.25
}
# monitor = HDMI-A-4, 2560x1440@59.95, 0x0, 1                           # main
monitor = DP-6, 2560x1440@74.97, -1440x-700, 1, transform, 3            # left
monitor = DP-5, 1920x1080@74.97,0x-1080, 1                              # up
monitor = eDP-1, disable
monitor = , preferred, auto, 1

render {
    cm_enabled = true
    cm_auto_hdr = 0
    # Use sRGB for untagged SDR apps; preserve explicit client color metadata.
    cm_sdr_eotf = srgb
}

#################
### AUTOSTART ###
#################

exec-once = waybar -c $HOME/.config/waybar/conf_xmg.jsonc
exec-once = hyprpaper
exec-once = hypridle

# Notification daemon
exec-once = mako

# Autoconnect for my JBL C5
exec-once = $HOME/.config/dotfiles/scripts/jbl_autoconnect.sh

# Battery status notification
exec-once = $HOME/.config/dotfiles/scripts/batt_check.sh

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia

##############################
### WINDOWS AND WORKSPACES ###
##############################

workspace = 1, monitor:HDMI-A-4, default:true
workspace = 2, monitor:HDMI-A-4, default:true
workspace = 3, monitor:HDMI-A-4, default:true
workspace = 4, monitor:HDMI-A-4, default:true
workspace = 5, monitor:HDMI-A-4, default:true
workspace = 6, monitor:HDMI-A-4, default:true
workspace = 7, monitor:HDMI-A-4, default:true
workspace = 8, monitor:DP-6, default:true
workspace = 9, monitor:DP-6, default:true
workspace = 10, monitor:DP-5, default:true

